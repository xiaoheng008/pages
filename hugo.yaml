title: &siteTitle Xiaoheng 的思考
baseURL: https://xiaoheng008.github.io/pages/
defaultContentLanguage: zh
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 思考、记录与文章。
  en:
    label: English
    locale: en-US
    weight: 2
    title: *siteTitle
    params:
      description: Notes, reflections, and essays.

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Xiaoheng
    from_year: 2026
  footer_center_info: 'Powered by [OINK](https://oink.pgsty.com)'
  github_repo: https://github.com/xiaoheng008/pages
  github_branch: main
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
